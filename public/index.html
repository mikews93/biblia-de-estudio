<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- use-credentials: si el dominio tiene protección de Vercel, el navegador pide el manifiesto con la sesión -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <!-- La barra de estado toma el color del fondo del tema (lo ajustan el script de abajo y src/app/_layout.tsx). -->
    <meta name="theme-color" content="#131313" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zarza" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Antes de pintar nada: el fondo con el tema guardado (src/lib/theme.ts) y la portada de carga. La página
         para Google (pipeline/seo_pages.py) queda en el HTML pero no se ve mientras carga la app. -->
    <script>
      (function () {
        var t = 'auto';
        try { t = JSON.parse(localStorage.getItem('ajustes') || '{}').theme || 'auto'; } catch (e) {}
        var dark = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var c = t === 'sepia' ? ['#F4ECD8', '#3E362E', '#E0D3B8'] : dark ? ['#131313', '#E6E3DE', '#302F2D'] : ['#F9F8F6', '#2A2826', '#E3E0DB'];
        var s = document.documentElement.style;
        s.backgroundColor = c[0];
        s.setProperty('--papel', c[0]);
        s.setProperty('--acento', c[1]);
        s.setProperty('--linea', c[2]);
        s.colorScheme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', c[0]);
        document.documentElement.classList.add('js');
      })();
    </script>
    <style id="portada-estilos">
      html.js .seo { display: none; }
      #portada {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--papel, #F9F8F6);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: opacity 220ms ease;
      }
      html.js #portada { display: flex; }
      #portada.fuera { opacity: 0; pointer-events: none; }
      /* La llama del ícono arde mientras carga: cada lengua chisporrotea a su ritmo, las hojas tiemblan una tras otra
         desde el centro y el resplandor respira. Del mismo tamaño que la pantalla de arranque de Android
         (fondo #131313 del manifiesto), para que el paso de una a otra no se note. */
      #portada svg { width: min(61vw, 260px); height: auto; border-radius: 40%; overflow: hidden; }
      #portada path[style] { fill: none; stroke: url(#pz-fuego); stroke-width: 18; stroke-linecap: round; }
      #portada .lengua, #portada .lengua path, #portada .halo, #portada .brasa { transform-box: view-box; }
      #portada .lengua, #portada .lengua path { transform-origin: 512px 800px; }
      #portada .halo, #portada .brasa { transform-origin: 512px 600px; }
      #portada .izq { animation: portada-izq 3.6s linear infinite; }
      #portada .der { animation: portada-der 2.4s linear -1s infinite; }
      #portada .lengua path { animation: portada-hoja 1.8s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -0.22s); }
      #portada .der path { animation-duration: 1.2s; animation-delay: calc(var(--i) * -0.15s - 0.45s); }
      #portada .brasa { animation: portada-brasa 1.8s linear infinite; }
      #portada .halo { animation: portada-halo 3.6s linear -0.6s infinite; }
      /* Pasos desiguales: el fuego no oscila, chisporrotea y se estira hacia arriba a tirones. Todos los ciclos
         caben justos en 7,2 s, así que la llama entera vuelve a su primer fotograma y sigue sin costura. */
      @keyframes portada-izq {
        0%, 100% { transform: rotate(0deg) scaleY(1) skewX(0deg); }
        12% { transform: rotate(-3.5deg) scaleY(1.09) skewX(2deg); }
        23% { transform: rotate(-1deg) scaleY(0.95) skewX(-1deg); }
        37% { transform: rotate(2.8deg) scaleY(1.13) skewX(-3deg); }
        48% { transform: rotate(0.5deg) scaleY(0.92) skewX(1deg); }
        61% { transform: rotate(-2.5deg) scaleY(1.06) skewX(3deg); }
        74% { transform: rotate(3.4deg) scaleY(1.11) skewX(-2deg); }
        87% { transform: rotate(-0.8deg) scaleY(0.96) skewX(0deg); }
      }
      @keyframes portada-der {
        0%, 100% { transform: rotate(0deg) scaleY(1) skewX(0deg); }
        14% { transform: rotate(3deg) scaleY(1.12) skewX(-2deg); }
        26% { transform: rotate(0.6deg) scaleY(0.93) skewX(1deg); }
        41% { transform: rotate(-3.2deg) scaleY(1.08) skewX(3deg); }
        55% { transform: rotate(-0.5deg) scaleY(1.15) skewX(-1deg); }
        67% { transform: rotate(2.4deg) scaleY(0.94) skewX(-3deg); }
        80% { transform: rotate(-2deg) scaleY(1.1) skewX(2deg); }
        91% { transform: rotate(1deg) scaleY(0.97) skewX(0deg); }
      }
      @keyframes portada-hoja { from { transform: rotate(-3.2deg); opacity: 0.65; } to { transform: rotate(3.2deg); opacity: 1; } }
      @keyframes portada-brasa {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        18% { opacity: 0.55; transform: scale(1.12); }
        33% { opacity: 0.22; transform: scale(0.94); }
        52% { opacity: 0.5; transform: scale(1.08); }
        71% { opacity: 0.28; transform: scale(0.97); }
        86% { opacity: 0.6; transform: scale(1.14); }
      }
      @keyframes portada-halo { 0%, 100% { opacity: 1; } 22% { opacity: 0.55; } 47% { opacity: 0.95; } 63% { opacity: 0.6; } 81% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #portada * { animation: none !important; } }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Transiciones entre pantallas (src/lib/transition.ts): cortas y suaves. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 220ms;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      html[data-nav='forward']::view-transition-old(root) { animation-name: vt-fade-out, vt-to-left; }
      html[data-nav='forward']::view-transition-new(root) { animation-name: vt-fade-in, vt-from-right; }
      html[data-nav='back']::view-transition-old(root) { animation-name: vt-fade-out, vt-to-right; }
      html[data-nav='back']::view-transition-new(root) { animation-name: vt-fade-in, vt-from-left; }
      /* Lo que no cambia entre pantallas (fixedInTransition): no se desliza; si cambia algo, se funde en su sitio. */
      ::view-transition-group(pestanas),
      ::view-transition-group(cabecera),
      ::view-transition-group(cabecera-izq),
      ::view-transition-group(cabecera-titulo),
      ::view-transition-group(cabecera-der),
      ::view-transition-group(progreso),
      ::view-transition-group(capitulos),
      ::view-transition-group(audio),
      ::view-transition-old(pestanas),
      ::view-transition-new(pestanas),
      ::view-transition-old(cabecera),
      ::view-transition-new(cabecera),
      ::view-transition-old(cabecera-izq),
      ::view-transition-new(cabecera-izq),
      ::view-transition-old(cabecera-titulo),
      ::view-transition-new(cabecera-titulo),
      ::view-transition-old(cabecera-der),
      ::view-transition-new(cabecera-der),
      ::view-transition-old(progreso),
      ::view-transition-new(progreso),
      ::view-transition-old(capitulos),
      ::view-transition-new(capitulos),
      ::view-transition-old(audio),
      ::view-transition-new(audio) {
        animation-duration: 160ms;
        animation-timing-function: ease;
      }
      /* Por encima del pliegue de pasar la hoja. */
      ::view-transition-group(pestanas),
      ::view-transition-group(cabecera),
      ::view-transition-group(cabecera-izq),
      ::view-transition-group(cabecera-titulo),
      ::view-transition-group(cabecera-der),
      ::view-transition-group(progreso),
      ::view-transition-group(capitulos),
      ::view-transition-group(audio) { z-index: 4; }
      /* Capítulo siguiente o anterior: se pasa la hoja como en un libro. Las animaciones las calcula
         src/lib/pageTurn.ts; aquí solo se apagan las de por defecto y se colocan las capas. El dorso de la
         hoja (#pliegue) y sus sombras solo existen en el estado nuevo de la transición. */
      #pliegue, #pliegue-sombra, #pliegue-brillo { display: none; }
      /* Mientras se arrastra la hoja (src/lib/pageSwipe.ts) no se selecciona texto. */
      html[data-swipe] * { user-select: none; -webkit-user-select: none; }
      html[data-fold] #pliegue,
      html[data-fold] #pliegue-sombra,
      html[data-fold] #pliegue-brillo {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      html[data-fold] #pliegue {
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg,
          color-mix(in srgb, var(--papel) 90%, gray),
          color-mix(in srgb, var(--papel) 96%, white) 55%,
          color-mix(in srgb, var(--papel) 88%, gray));
      }
      html[data-fold] #pliegue-sombra {
        width: 90px;
        height: 300vh;
        background: linear-gradient(to right, rgba(0, 0, 0, 0.32), rgba(0, 0, 0, 0.1) 35%, rgba(0, 0, 0, 0));
      }
      html[data-fold] #pliegue-brillo {
        width: 120px;
        height: 300vh;
        background: linear-gradient(to right,
          rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.04) 22%, rgba(255, 255, 255, 0.14) 48%, rgba(255, 255, 255, 0) 100%);
      }
      html[data-nav^='turn']::view-transition-group(pliegue-sombra) { z-index: 2; animation: none; }
      html[data-nav^='turn']::view-transition-group(pliegue) { z-index: 3; animation: none; }
      html[data-nav^='turn']::view-transition-group(pliegue-brillo) { z-index: 3; animation: none; }
      html[data-nav^='turn']::view-transition-new(pliegue),
      html[data-nav^='turn']::view-transition-new(pliegue-sombra),
      html[data-nav^='turn']::view-transition-new(pliegue-brillo) { animation: none; transform-origin: 0 0; }
      html[data-nav^='turn']::view-transition-old(root),
      html[data-nav^='turn']::view-transition-new(root) { animation: none; }
      html[data-nav='turn-forward']::view-transition-old(root) { z-index: 2; }
      /* Hasta que arranca pageTurn.ts (un fotograma) las capas que entran no se ven. */
      html[data-nav='turn-back']::view-transition-new(root),
      html[data-nav^='turn']::view-transition-new(pliegue) { clip-path: polygon(0 0, 0 0, 0 0); }
      html[data-nav^='turn']::view-transition-new(pliegue-sombra),
      html[data-nav^='turn']::view-transition-new(pliegue-brillo) { transform: translateX(-300vw); }
      @keyframes vt-fade-in { from { opacity: 0; } }
      @keyframes vt-fade-out { to { opacity: 0; } }
      @keyframes vt-from-right { from { transform: translateX(28px); } }
      @keyframes vt-from-left { from { transform: translateX(-28px); } }
      @keyframes vt-to-left { to { transform: translateX(-28px); } }
      @keyframes vt-to-right { to { transform: translateX(28px); } }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) { animation: none !important; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="portada" aria-hidden="true">
      <!-- La llama del ícono (assets/icono), dibujada aquí para que pueda arder mientras carga la app. -->
      <svg viewBox="0 0 1024 1024">
        <defs>
          <linearGradient id="pz-fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D1410"/><stop offset="1" stop-color="#0B0807"/></linearGradient>
          <radialGradient id="pz-halo" cx="50%" cy="58%" r="48%"><stop offset="0" stop-color="#F08A2C" stop-opacity=".38"/><stop offset="1" stop-color="#F08A2C" stop-opacity="0"/></radialGradient>
          <linearGradient id="pz-fuego" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="180"><stop offset="0" stop-color="#B83A12"/><stop offset=".45" stop-color="#F08A2C"/><stop offset=".85" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFF1C9"/></linearGradient>
          <filter id="pz-difuso" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
          <clipPath id="pz-izq"><path d="M500 800 C 372 786 292 704 292 584 C 292 466 380 398 430 280 C 468 360 500 432 500 510 Z"/></clipPath>
          <clipPath id="pz-der"><path d="M524 800 C 652 786 732 704 732 584 C 732 432 640 340 600 176 C 556 300 524 400 524 510 Z"/></clipPath>
        </defs>
        <rect width="1024" height="1024" fill="url(#pz-fondo)"/>
        <rect class="halo" width="1024" height="1024" fill="url(#pz-halo)"/>
        <ellipse class="brasa" cx="512" cy="540" rx="220" ry="270" fill="#F08A2C" opacity=".3" filter="url(#pz-difuso)"/>
        <g class="lengua izq"><g clip-path="url(#pz-izq)"><path d="M512 800 Q 152 791 -164 619" style="--i:9"/><path d="M512 800 Q 156 744 -135 532" style="--i:8"/><path d="M512 800 Q 167 698 -94 450" style="--i:7"/><path d="M512 800 Q 183 654 -43 374" style="--i:6"/><path d="M512 800 Q 205 612 17 305" style="--i:5"/><path d="M512 800 Q 232 573 86 245" style="--i:4"/><path d="M512 800 Q 264 539 162 194" style="--i:3"/><path d="M512 800 Q 300 509 244 153" style="--i:2"/><path d="M512 800 Q 340 484 331 124" style="--i:1"/><path d="M512 800 Q 383 464 421 106" style="--i:0"/></g></g>
        <g class="lengua der"><g clip-path="url(#pz-der)"><path d="M512 800 Q 641 464 603 106" style="--i:0"/><path d="M512 800 Q 684 484 693 124" style="--i:1"/><path d="M512 800 Q 724 509 780 153" style="--i:2"/><path d="M512 800 Q 760 539 862 194" style="--i:3"/><path d="M512 800 Q 792 573 938 245" style="--i:4"/><path d="M512 800 Q 819 612 1007 305" style="--i:5"/><path d="M512 800 Q 841 654 1067 374" style="--i:6"/><path d="M512 800 Q 857 698 1118 450" style="--i:7"/><path d="M512 800 Q 868 744 1159 532" style="--i:8"/><path d="M512 800 Q 872 791 1188 619" style="--i:9"/></g></g>
        <path d="M210 812 C 330 782 440 790 512 840 C 584 790 694 782 814 812" stroke="#FFF1D6" stroke-width="30" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
  </body>
</html>
