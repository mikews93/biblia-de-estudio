<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- use-credentials: si el dominio tiene protección de Vercel, el navegador pide el manifiesto con la sesión -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#8A4B2A" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Biblia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Transiciones entre pantallas (src/lib/transition.ts): cortas y suaves. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 220ms;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      html[data-nav='forward']::view-transition-old(root) { animation-name: vt-fade-out, vt-to-left; }
      html[data-nav='forward']::view-transition-new(root) { animation-name: vt-fade-in, vt-from-right; }
      html[data-nav='back']::view-transition-old(root) { animation-name: vt-fade-out, vt-to-right; }
      html[data-nav='back']::view-transition-new(root) { animation-name: vt-fade-in, vt-from-left; }
      /* Lo que no cambia entre pantallas (fixedInTransition): no se desliza; si cambia algo, se funde en su sitio. */
      ::view-transition-group(pestanas),
      ::view-transition-group(cabecera),
      ::view-transition-group(cabecera-izq),
      ::view-transition-group(cabecera-titulo),
      ::view-transition-group(cabecera-der),
      ::view-transition-group(progreso),
      ::view-transition-group(capitulos),
      ::view-transition-group(audio),
      ::view-transition-old(pestanas),
      ::view-transition-new(pestanas),
      ::view-transition-old(cabecera),
      ::view-transition-new(cabecera),
      ::view-transition-old(cabecera-izq),
      ::view-transition-new(cabecera-izq),
      ::view-transition-old(cabecera-titulo),
      ::view-transition-new(cabecera-titulo),
      ::view-transition-old(cabecera-der),
      ::view-transition-new(cabecera-der),
      ::view-transition-old(progreso),
      ::view-transition-new(progreso),
      ::view-transition-old(capitulos),
      ::view-transition-new(capitulos),
      ::view-transition-old(audio),
      ::view-transition-new(audio) {
        animation-duration: 160ms;
        animation-timing-function: ease;
      }
      /* Capítulo siguiente o anterior: se pasa la hoja. Hacia adelante la página actual gira sobre su borde
         izquierdo y deja ver la nueva debajo; hacia atrás la anterior vuelve a caer encima. Sin fundidos. */
      html[data-nav='turn-forward']::view-transition-old(root),
      html[data-nav='turn-back']::view-transition-new(root) {
        z-index: 2;
        transform-origin: left center;
        backface-visibility: hidden;
        animation: vt-turn-away 460ms cubic-bezier(0.45, 0, 0.2, 1) both;
      }
      html[data-nav='turn-back']::view-transition-new(root) { animation-name: vt-turn-in; }
      html[data-nav='turn-forward']::view-transition-new(root) { animation: vt-uncover 460ms ease both; }
      html[data-nav='turn-back']::view-transition-old(root) { animation: vt-cover 460ms ease both; }
      @keyframes vt-turn-away {
        from { transform: perspective(1800px) rotateY(0deg); }
        to { transform: perspective(1800px) rotateY(-100deg); filter: brightness(0.7); }
      }
      @keyframes vt-turn-in {
        from { transform: perspective(1800px) rotateY(-100deg); filter: brightness(0.7); }
        to { transform: perspective(1800px) rotateY(0deg); }
      }
      @keyframes vt-uncover { from { filter: brightness(0.82); } }
      @keyframes vt-cover { to { filter: brightness(0.82); } }
      @keyframes vt-fade-in { from { opacity: 0; } }
      @keyframes vt-fade-out { to { opacity: 0; } }
      @keyframes vt-from-right { from { transform: translateX(28px); } }
      @keyframes vt-from-left { from { transform: translateX(-28px); } }
      @keyframes vt-to-left { to { transform: translateX(-28px); } }
      @keyframes vt-to-right { to { transform: translateX(28px); } }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) { animation: none !important; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
  </body>
</html>
