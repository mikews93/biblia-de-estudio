<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- use-credentials: si el dominio tiene protección de Vercel, el navegador pide el manifiesto con la sesión -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#8A4B2A" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Biblia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Transiciones entre pantallas (src/lib/transition.ts): cortas y suaves. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 220ms;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      html[data-nav='forward']::view-transition-old(root) { animation-name: vt-fade-out, vt-to-left; }
      html[data-nav='forward']::view-transition-new(root) { animation-name: vt-fade-in, vt-from-right; }
      html[data-nav='back']::view-transition-old(root) { animation-name: vt-fade-out, vt-to-right; }
      html[data-nav='back']::view-transition-new(root) { animation-name: vt-fade-in, vt-from-left; }
      /* Lo que no cambia entre pantallas (fixedInTransition): no se desliza; si cambia algo, se funde en su sitio. */
      ::view-transition-group(pestanas),
      ::view-transition-group(cabecera),
      ::view-transition-group(cabecera-izq),
      ::view-transition-group(cabecera-titulo),
      ::view-transition-group(cabecera-der),
      ::view-transition-group(progreso),
      ::view-transition-group(capitulos),
      ::view-transition-group(audio),
      ::view-transition-old(pestanas),
      ::view-transition-new(pestanas),
      ::view-transition-old(cabecera),
      ::view-transition-new(cabecera),
      ::view-transition-old(cabecera-izq),
      ::view-transition-new(cabecera-izq),
      ::view-transition-old(cabecera-titulo),
      ::view-transition-new(cabecera-titulo),
      ::view-transition-old(cabecera-der),
      ::view-transition-new(cabecera-der),
      ::view-transition-old(progreso),
      ::view-transition-new(progreso),
      ::view-transition-old(capitulos),
      ::view-transition-new(capitulos),
      ::view-transition-old(audio),
      ::view-transition-new(audio) {
        animation-duration: 160ms;
        animation-timing-function: ease;
      }
      /* Por encima del pliegue de pasar la hoja. */
      ::view-transition-group(pestanas),
      ::view-transition-group(cabecera),
      ::view-transition-group(cabecera-izq),
      ::view-transition-group(cabecera-titulo),
      ::view-transition-group(cabecera-der),
      ::view-transition-group(progreso),
      ::view-transition-group(capitulos),
      ::view-transition-group(audio) { z-index: 4; }
      /* Capítulo siguiente o anterior: se pasa la hoja como papel. Hacia adelante un pliegue barre la página
         de derecha a izquierda: a su derecha aparece el capítulo nuevo y a su izquierda se ve el dorso de la
         hoja que se levanta, con su sombra. Hacia atrás es la misma película al revés. El pliegue es
         #pliegue (src/app/_layout.tsx), que solo existe en el estado nuevo de la transición. */
      #pliegue { display: none; }
      html[data-fold] #pliegue {
        display: block;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 44vw;
        pointer-events: none;
        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.14) 6%,
          color-mix(in srgb, var(--papel) 92%, black) 8%,
          color-mix(in srgb, var(--papel) 80%, white) 45%,
          color-mix(in srgb, var(--papel) 96%, white) 70%,
          color-mix(in srgb, var(--papel) 86%, black) 79.4%,
          rgba(0, 0, 0, 0.28) 79.5%,
          rgba(0, 0, 0, 0.08) 88%,
          rgba(0, 0, 0, 0) 100%
        );
      }
      html[data-nav^='turn']::view-transition-group(pliegue) { z-index: 3; animation: vt-fold-sweep 560ms cubic-bezier(0.45, 0, 0.35, 1) both; }
      html[data-nav^='turn']::view-transition-new(pliegue) { animation: none; }
      html[data-nav='turn-forward']::view-transition-old(root),
      html[data-nav='turn-back']::view-transition-new(root) {
        z-index: 2;
        animation: vt-fold-clip 560ms cubic-bezier(0.45, 0, 0.35, 1) both;
      }
      html[data-nav='turn-back']::view-transition-group(pliegue),
      html[data-nav='turn-back']::view-transition-new(root) { animation-direction: reverse; }
      html[data-nav='turn-forward']::view-transition-new(root),
      html[data-nav='turn-back']::view-transition-old(root) { animation: none; }
      /* El borde del pliegue (79,5 % del ancho de #pliegue) coincide en todo momento con el recorte de la hoja. */
      @keyframes vt-fold-clip {
        from { clip-path: polygon(0 0, 135% 0, 135% 100%, 0 100%); }
        to { clip-path: polygon(0 0, -9% 0, -9% 100%, 0 100%); }
      }
      @keyframes vt-fold-sweep {
        from { transform: translateX(100vw); }
        to { transform: translateX(-44vw); }
      }
      @keyframes vt-fade-in { from { opacity: 0; } }
      @keyframes vt-fade-out { to { opacity: 0; } }
      @keyframes vt-from-right { from { transform: translateX(28px); } }
      @keyframes vt-from-left { from { transform: translateX(-28px); } }
      @keyframes vt-to-left { to { transform: translateX(-28px); } }
      @keyframes vt-to-right { to { transform: translateX(28px); } }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) { animation: none !important; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
  </body>
</html>
