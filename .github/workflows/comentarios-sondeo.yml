name: Sondeo de comentarios (temporal)
on:
  push:
    paths: [.github/workflows/comentarios-sondeo.yml, pipeline/build_comentarios.py]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 pipeline/build_comentarios.py /tmp/out barnes calvin kd tdavid wesley scofield
      - run: |
          python3 - <<'PY'
          import gzip, json, os
          for src in ['barnes', 'calvin', 'kd', 'tdavid', 'wesley', 'scofield']:
              for f in ['jhn/3', 'psa/23', 'gen/1', 'isa/53', 'rom/8']:
                  p = f'/tmp/out/{src}/{f}.json.gz'
                  if not os.path.exists(p):
                      print('#####', src, f, 'NO'); continue
                  d = json.loads(gzip.open(p).read())
                  print('#####', src, f, [(s['desde'], s['hasta'], len(s['partes'])) for s in d][:15])
                  for s in d[:2]:
                      print('  [', s['titulo'], ']', s['partes'][0][:600].replace('\n', ' / '))
          PY
          du -sh /tmp/out/*
