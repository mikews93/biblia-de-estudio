name: Sondeo de comentarios (temporal)
on:
  push:
    paths: [.github/workflows/comentarios-sondeo.yml]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir m && cd m
          curl -sSL -o mods.tar.gz https://crosswire.org/ftpmirror/pub/sword/raw/mods.d.tar.gz
          tar xzf mods.tar.gz
          for f in mods.d/*.conf; do
            if grep -qiE '^Category=Commentaries|^ModDrv=(zCom|zCom4|RawCom|RawCom4|HREFCom)' "$f"; then
              echo "== $f"; grep -E '^(\[|Description|ModDrv|SourceType|Versification|DistributionLicense|Lang|DataPath|Version)' "$f"
            fi
          done
      - run: |
          for m in Barnes Gill KD RWP Vincent Wesley CalvinCommentaries TFG Clarke JFB MHC TSK Spurgeon TreasuryOfDavid Poole Lightfoot Darby; do
            if curl -sSfL -o $m.zip https://crosswire.org/ftpmirror/pub/sword/packages/rawzip/$m.zip; then
              echo "== $m $(sha256sum $m.zip | cut -c1-64) $(stat -c%s $m.zip)"; unzip -l $m.zip | tail -n +4 | head -12
            else echo "== $m NO"; fi
          done
