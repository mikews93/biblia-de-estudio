name: Ilustraciones del Espacio Niños

# Genera con Cloudflare AI Gateway (como en deusrex) las candidatas de las ilustraciones de las historias para niños
# (pipeline/ilustraciones/) y las sube a la misma rama. Las ya generadas no se vuelven a pedir.
# Necesita los secretos CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_AI_API_TOKEN (los mismos del audio dramatizado).

# Se lanza a mano (Actions › Run workflow) para no fallar en cada push mientras los secretos no estén.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ilustraciones-ninos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - name: Generar
        run: python3 pipeline/ilustraciones/generar.py
      - name: Subir las candidatas a la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/ilustraciones/candidatas
          git diff --cached --quiet && exit 0
          git commit -m "chore(ilustraciones): candidatas generadas para el Espacio Niños"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
