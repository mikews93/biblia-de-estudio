name: Calibrar buscador (temporal)
on:
  push:
    branches: [claude/project-thread-awsnku-calibrar]
jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run data
      - run: sh pipeline/semantica/traer.sh && node pipeline/semantica/textos.mjs public/data
      - run: DATA_DIR=public/data npx tsx pipeline/semantica/calibrar.ts
