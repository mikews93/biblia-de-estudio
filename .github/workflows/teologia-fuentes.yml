name: Fuentes de teología

# Descarga las obras de teología de dominio público (CCEL, Internet Archive, Project Gutenberg,
# biblicalstudies.org.uk) y las deja como
# archivos de la versión «teologia-fuentes-v1» de este repositorio, para que pipeline/build_teologia.py las lea aunque
# esos sitios no se puedan abrir desde el entorno de desarrollo. Se lanza al cambiar la lista o a mano.

on:
  push:
    paths:
      - pipeline/teologia_fuentes.txt
      - .github/workflows/teologia-fuentes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: teologia-fuentes-v1
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        id: descargar
        run: |
          mkdir -p fuentes
          # Solo las que faltan en la versión: así un sitio lento (archive.org) no frena las nuevas.
          gh release view "$TAG" --json assets -q '.assets[].name' > ya.txt 2>/dev/null || true
          grep -v '^#' pipeline/teologia_fuentes.txt | while read -r name url; do
            [ -z "$name" ] && continue
            grep -qx "$name" ya.txt && continue
            code=$(curl -sL --connect-timeout 30 --max-time 300 --retry 1 --retry-all-errors -A 'Mozilla/5.0 (biblia-de-estudio)' -o "fuentes/$name" -w '%{http_code}' "$url" || true)
            echo "$code $(stat -c %s "fuentes/$name" 2>/dev/null) $name $url"
            [ "$code" = 200 ] || rm -f "fuentes/$name"
          done
          # Si ya estaban todas, no hay nada que publicar y el paso siguiente se salta.
          if [ -n "$(ls -A fuentes)" ]; then
            (cd fuentes && sha256sum * | tee ../sha256-$(date +%Y%m%d%H%M).txt)
            echo "nuevas=true" >> "$GITHUB_OUTPUT"
          else
            echo "Todas las fuentes ya están en la versión $TAG."
          fi
      - name: Publicar los archivos
        if: steps.descargar.outputs.nuevas == 'true'
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Fuentes de teología (dominio público)" \
            --notes "Copias de obras de dominio público para pipeline/build_teologia.py." --prerelease
          gh release upload "$TAG" fuentes/* sha256-*.txt --clobber
