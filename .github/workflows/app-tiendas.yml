# Compila la app para las tiendas con EAS (Expo) y, si se pide, la sube a Google Play como borrador de prueba interna.
# A mano, o al subir una etiqueta de versión (git tag v1.1.0 && git push origin v1.1.0): entonces compila «production»
# para las plataformas de la variable del repo TIENDAS_PLATAFORMA (android por defecto; «all» cuando exista la app de
# Apple) y la sube sola si la variable TIENDAS_SUBIR es «true». Solo hace falta cuando cambia algo nativo; lo demás
# llega a las apps instaladas con app-actualizar.yml. Cada compilación cuenta en el cupo gratis de Expo (unas 30 al
# mes, 15 de iOS).
# Necesita el secreto EXPO_TOKEN (expo.dev → Account settings → Access tokens). Para subir a Google Play, la
# clave de la cuenta de servicio se guarda una vez en EAS (`eas credentials`), no en GitHub.
name: App para tiendas

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plataforma:
        description: android, ios o all
        default: android
      perfil:
        description: preview (APK para probar) o production (para la tienda)
        default: preview
      subir:
        description: Subir a la tienda al terminar (solo production)
        type: boolean
        default: false

jobs:
  eas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Enlaza la app con el proyecto de expo.dev (owner y slug de app.json) y escribe su projectId, que hace falta
      # para las notificaciones push. Si app.json ya lo trae, no cambia nada.
      - name: Enlazar con expo.dev
        run: |
          eas init --non-interactive --force
          echo "projectId: $(node -p "require('./app.json').expo.extra?.eas?.projectId")"
      # La huella nativa (runtimeVersion «fingerprint») cuenta el google-services.json que EAS entrega al compilar.
      # EAS la calcula también aquí antes de subir; sin el archivo no coinciden y la compilación falla con
      # «Runtime version mismatch». Se baja igual que en app-actualizar.yml.
      - name: Bajar google-services.json de EAS
        run: |
          eas env:pull --environment ${{ inputs.perfil || 'production' }} --non-interactive --path "$RUNNER_TEMP/eas.env"
          if [ -f .eas/.env/GOOGLE_SERVICES_JSON ]; then
            echo "ZARZA_GOOGLE_SERVICES=$PWD/.eas/.env/GOOGLE_SERVICES_JSON" >> "$GITHUB_ENV"
          else
            echo "::warning::No llegó GOOGLE_SERVICES_JSON de expo.dev."
          fi
      - name: Compilar
        run: >
          eas build --non-interactive --no-wait
          --platform ${{ inputs.plataforma || vars.TIENDAS_PLATAFORMA || 'android' }}
          --profile ${{ inputs.perfil || 'production' }}
          ${{ (github.event_name == 'push' && vars.TIENDAS_SUBIR == 'true' || inputs.subir && inputs.perfil == 'production') && '--auto-submit' || '' }}
