name: Sonidos de Freesound para el dramatizado

# Busca en Freesound los sonidos reales del audio dramatizado a pedido (pipeline/audio_dramatizado/sonidos.mjs), solo
# con licencia CC0 o CC BY, y los sube a public/audio/sonidos en la misma rama, para escucharlos y aprobarlos en el PR.
# Solo busca los que faltan. Necesita el secreto FREESOUND_API_KEY; sin él, no hace nada.

on:
  push:
    paths:
      - pipeline/audio_dramatizado/sonidos.mjs
      - .github/workflows/sonidos-dramatizado.yml
  workflow_dispatch:
    inputs:
      ids:
        description: Sonidos a buscar (ids separados por espacios; vacío = todos los que falten)
        default: ''

permissions:
  contents: write

concurrency:
  group: sonidos-dramatizado
  cancel-in-progress: false

jobs:
  componer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar y descargar
        if: env.FREESOUND_API_KEY != ''
        run: node pipeline/audio_dramatizado/sonidos.mjs ${{ github.event.inputs.ids }}
      - name: Subir a la rama
        if: env.FREESOUND_API_KEY != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/sonidos
          git diff --cached --quiet && exit 0
          git commit -m "chore(audio): add Freesound sounds for dramatized audio"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
