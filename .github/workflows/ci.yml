name: CI

# Para no gastar minutos: no corre si solo cambian textos o lo que graban las acciones de audio e ilustraciones,
# y un push nuevo al mismo PR cancela la ejecución anterior.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - public/audio/**
      - pipeline/audio_dramatizado/**
      - pipeline/audio_original/**
      - pipeline/podcast/**
      - pipeline/ilustraciones/**
  pull_request:
    paths-ignore:
      - '**/*.md'
      - public/audio/**
      - pipeline/audio_dramatizado/**
      - pipeline/audio_original/**
      - pipeline/podcast/**
      - pipeline/ilustraciones/**

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Base de datos para las pruebas de api/comunidades.ts y los flujos e2e con cuenta
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblia_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/biblia_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run data
      - run: npm run comentarios
      - run: npm run build:web
      - name: Pruebas unitarias
        run: npm test
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas e2e
        run: npm run test:e2e
      # La cuota de artefactos se puede agotar: el contexto de cada fallo queda también en el registro.
      - name: Contexto de las pruebas que fallaron
        if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
